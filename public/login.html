<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventHive - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { background: #ffffff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); max-width: 460px; width: 100%; overflow: hidden; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="bg-primary text-white text-center p-4">
      <h3 class="fw-bold mb-0"><i class="bi bi-calendar-event me-2"></i>EventHive</h3>
      <small class="text-white-50">Campus Event & Fest Portal</small>
    </div>
    <div class="p-4 p-md-5">
      <div id="loginAlert" class="alert alert-danger d-none py-2 mb-3 small" role="alert"></div>
      <form id="loginForm">
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email Address</label>
          <input type="email" class="form-control" id="email" placeholder="name@college.edu" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label fw-semibold">Password</label>
          <input type="password" class="form-control" id="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary w-100 fw-semibold mb-3">Sign In</button>
        <div class="text-center small text-muted">Don't have an account? <a href="register.html" class="text-decoration-none">Register here</a></div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('loginAlert');
    const submitBtn = document.getElementById('submitBtn');

    function showError(msg) {
      alertBox.textContent = msg;
      alertBox.classList.remove('d-none');
    }

    function clearError() {
      alertBox.textContent = '';
      alertBox.classList.add('d-none');
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error') === 'auth_required') {
      showError('Please sign in to access your dashboard.');
    } else if (urlParams.get('error') === 'session_expired') {
      showError('Your session has expired. Please sign in again.');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError('Please enter both email address and password.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Signing In...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok || !data.success) {
          showError(data.error || 'Invalid email or password.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
          return;
        }

        sessionStorage.setItem('isLoggedIn', 'true');
        sessionStorage.setItem('authToken', data.token);
        sessionStorage.setItem('userRole', data.user.role);
        sessionStorage.setItem('userIdentifier', data.user.email);
        sessionStorage.setItem('userData', JSON.stringify(data.user));

        const role = (data.user.role || '').toLowerCase();
        if (role === 'student') {
          window.location.replace('/student/dashboard');
        } else if (role === 'coordinator' || role === 'club') {
          window.location.replace('/coordinator/dashboard');
        } else if (role === 'faculty' || role === 'teacher') {
          window.location.replace('/faculty/dashboard');
        } else if (role === 'hod') {
          window.location.replace('/hod/dashboard');
        } else if (role === 'admin') {
          window.location.replace('/admin/dashboard');
        } else if (role === 'hr') {
          window.location.replace('/hr/dashboard');
        } else {
          window.location.replace('/student/dashboard');
        }
      } catch (err) {
        showError('Server connection failed. Make sure the Node.js server is running.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
