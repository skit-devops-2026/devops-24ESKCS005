<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><title>Club Dashboard - EventHive</title>
  <script>
    const user = JSON.parse(sessionStorage.getItem('userData') || '{}');
    if (!sessionStorage.getItem('isLoggedIn') || user.role !== 'club') window.location.replace('../../login.html');
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-primary" href="#">EventHive <span class="text-white-50 fs-6">| Club Organizer</span></a>
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-warning btn-sm fw-semibold" data-bs-toggle="modal" data-bs-target="#proposeModal"><i class="bi bi-plus-circle me-1"></i>Propose Event</button>
        <button class="btn btn-danger btn-sm" onclick="sessionStorage.clear(); window.location.replace('../../login.html');">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="card p-4 bg-primary text-white rounded-3 mb-4 shadow-sm">
      <h3 class="fw-bold mb-1">Club Event Management</h3>
      <p class="text-white-50 mb-0">Events proposed here are routed to respective Faculty Mentors for Stage 1 Verification.</p>
    </div>

    <div class="card shadow-sm border-0 mb-4">
      <div class="card-header bg-white py-3"><h5 class="fw-bold mb-0 text-primary">All Club Events & Multi-Stage Approval Pipeline</h5></div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light"><tr><th>Event Title</th><th>Date & Venue</th><th>Category</th><th>Budget</th><th>Faculty Verification</th><th>HOD Sanction</th><th>Status</th></tr></thead>
          <tbody id="clubEventsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="proposeModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-dark text-white"><h5 class="modal-title fw-bold">Propose Event</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
        <form id="proposeForm">
          <div class="modal-body p-4">
            <div class="row g-3 mb-3">
              <div class="col-md-8"><label class="form-label fw-semibold">Event Title *</label><input type="text" class="form-control" id="pTitle" required></div>
              <div class="col-md-4"><label class="form-label fw-semibold">Club Category *</label>
                <select class="form-select" id="pCategory" required>
                  <option value="Robotics">Robotics</option><option value="Tech">Tech (ICI)</option><option value="NSS">NSS</option><option value="Non-Tech">Non-Tech (Pravah)</option><option value="Sports">Sports</option>
                </select>
              </div>
              <div class="col-md-6"><label class="form-label fw-semibold">Date *</label><input type="date" class="form-control" id="pDate" required></div>
              <div class="col-md-6"><label class="form-label fw-semibold">Venue *</label><input type="text" class="form-control" id="pVenue" placeholder="e.g. Main Auditorium" required></div>
              <div class="col-md-4"><label class="form-label fw-semibold">Fee (₹)</label><input type="number" class="form-control" id="pFee" value="0" required></div>
              <div class="col-md-4"><label class="form-label fw-semibold">Max Team Size</label><input type="number" class="form-control" id="pSize" value="4" required></div>
              <div class="col-md-4"><label class="form-label fw-semibold">Estimated Budget (₹) *</label><input type="number" class="form-control" id="pBudget" required></div>
              <div class="col-12"><label class="form-label fw-semibold">Description</label><textarea class="form-control" id="pDesc" rows="2"></textarea></div>
            </div>
          </div>
          <div class="modal-footer"><button type="submit" class="btn btn-primary">Submit to Faculty Mentor</button></div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    async function loadClubEvents() {
      const res = await fetch('/api/events/club/all');
      const events = await res.json();
      const tbody = document.getElementById('clubEventsBody');
      tbody.innerHTML = '';
      events.forEach(e => {
        tbody.innerHTML += `
          <tr>
            <td><strong>${e.title}</strong></td>
            <td>${e.date}<br><small class="text-muted">${e.venue}</small></td>
            <td><span class="badge bg-info-subtle text-info-emphasis">${e.category}</span></td>
            <td>₹${e.budget}</td>
            <td><span class="badge ${e.facultyStatus === 'Approved' ? 'bg-success' : 'bg-warning text-dark'}">${e.facultyStatus}</span></td>
            <td><span class="badge ${e.hodStatus === 'Approved' ? 'bg-success' : 'bg-secondary'}">${e.hodStatus}</span></td>
            <td><span class="badge ${e.isLive ? 'bg-success' : 'bg-dark'}">${e.isLive ? 'Live' : 'Pipeline'}</span></td>
          </tr>
        `;
      });
    }

    document.getElementById('proposeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        title: document.getElementById('pTitle').value,
        category: document.getElementById('pCategory').value,
        date: document.getElementById('pDate').value,
        venue: document.getElementById('pVenue').value,
        fee: Number(document.getElementById('pFee').value),
        maxTeamSize: Number(document.getElementById('pSize').value),
        budget: Number(document.getElementById('pBudget').value),
        description: document.getElementById('pDesc').value
      };
      await fetch('/api/events/propose', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      alert('🎉 Proposal submitted! Forwarded to Faculty Mentor for review.');
      bootstrap.Modal.getInstance(document.getElementById('proposeModal')).hide();
      loadClubEvents();
    });

    loadClubEvents();
  </script>
</body>
</html>
