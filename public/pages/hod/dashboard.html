<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><title>HOD Authority Dashboard - EventHive</title>
  <script>
    const user = JSON.parse(sessionStorage.getItem('userData') || '{}');
    if (!sessionStorage.getItem('isLoggedIn') || user.role !== 'hod') window.location.replace('../../login.html');
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-primary" href="#">EventHive <span class="text-white-50 fs-6">| HOD Authority & Sanctions</span></a>
      <button class="btn btn-danger btn-sm" onclick="sessionStorage.clear(); window.location.replace('../../login.html');">Logout</button>
    </div>
  </nav>

  <div class="container py-4">
    <div class="card p-4 bg-dark text-white rounded-3 mb-4 shadow-sm">
      <h3 class="fw-bold mb-1">Head of Department (Central Authority)</h3>
      <p class="text-white-50 mb-0">Final Sanction Desk & Conflict Management for Verified Proposals.</p>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-header bg-white py-3"><h5 class="fw-bold mb-0 text-dark"><i class="bi bi-patch-check-fill text-success me-2"></i>Faculty-Verified Proposals Awaiting Final Sanction</h5></div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light"><tr><th>Event Title</th><th>Category</th><th>Date & Venue</th><th>Budget</th><th>HOD Action</th></tr></thead>
          <tbody id="hodTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    async function loadHodProposals() {
      const res = await fetch('/api/events/hod/proposals');
      const events = await res.json();
      const tbody = document.getElementById('hodTableBody');
      tbody.innerHTML = events.length === 0 ? '<tr><td colspan="5" class="text-center text-muted py-3">No verified proposals pending sanction.</td></tr>' : '';
      events.forEach(e => {
        tbody.innerHTML += `
          <tr>
            <td><strong>${e.title}</strong></td>
            <td><span class="badge bg-info-subtle text-info-emphasis">${e.category}</span></td>
            <td>${e.date}<br><small class="text-muted">${e.venue}</small></td>
            <td class="fw-bold">₹${e.budget}</td>
            <td>
              ${!e.isLive ? `
                <button class="btn btn-success btn-sm me-1" onclick="sanctionEvent('${e._id}', 'Approved')"><i class="bi bi-check2-circle me-1"></i>Sanction & Make Live</button>
                <button class="btn btn-outline-warning btn-sm me-1" onclick="shiftVenue('${e._id}')">Shift Venue</button>
                <button class="btn btn-danger btn-sm" onclick="sanctionEvent('${e._id}', 'Rejected')">Reject</button>
              ` : '<span class="badge bg-success">Sanctioned & Live on Student Portal</span>'}
            </td>
          </tr>
        `;
      });
    }

    async function sanctionEvent(id, status) {
      await fetch(`/api/events/${id}/hod-status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      alert(`🎉 Final Sanction granted! Event is now LIVE on Student Dashboard.`);
      loadHodProposals();
    }

    async function shiftVenue(id) {
      const venue = prompt('Enter new venue to resolve conflict:', 'Seminar Hall 2');
      if (venue) {
        await fetch(`/api/events/${id}/hod-status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'Approved', venue })
        });
        alert(`Venue shifted to ${venue} and Event sanctioned!`);
        loadHodProposals();
      }
    }

    loadHodProposals();
  </script>
</body>
</html>
