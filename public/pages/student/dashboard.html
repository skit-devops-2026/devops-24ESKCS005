<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><title>Student Dashboard - EventHive</title>
  <script>
    const user = JSON.parse(sessionStorage.getItem('userData') || '{}');
    if (!sessionStorage.getItem('isLoggedIn') || user.role !== 'student') window.location.replace('../../login.html');
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    .event-card { border: none; border-radius: 12px; overflow: hidden; transition: transform 0.2s; }
    .event-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.12); }
    .event-banner-img { height: 180px; width: 100%; object-fit: cover; }
  </style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-primary" href="#"><i class="bi bi-calendar-event me-2"></i>EventHive</a>
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-light btn-sm me-2" onclick="loadMyTickets()" data-bs-toggle="modal" data-bs-target="#myTicketsModal">
          <i class="bi bi-ticket-perforated me-1"></i> My Registrations
        </button>
        <span class="text-white-50 small d-none d-sm-inline" id="userDisplay">Welcome</span>
        <button class="btn btn-danger btn-sm" onclick="sessionStorage.clear(); window.location.replace('../../login.html');">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="p-4 p-md-5 mb-4 bg-primary text-white rounded-3 shadow-sm">
      <h2 class="fw-bold">Campus Events & Tournaments 🌟</h2>
      <p class="mb-0 text-white-50">Register for NSS Drives, Hackathons, Pravah Cultural Fests, Robowars, and Sports meets.</p>
    </div>

    <div class="row g-4" id="eventsGrid"></div>
  </div>

  <!-- Registration Modal -->
  <div class="modal fade" id="eventRegModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold" id="modalTitle">Register</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form id="teamRegForm">
          <div class="modal-body p-4">
            <div class="alert alert-info d-flex justify-content-between align-items-center mb-3">
              <div><strong>Registration Fee:</strong> <span id="mFee">₹0</span></div>
              <span class="badge bg-primary" id="mCategoryBadge">NSS</span>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-6"><label class="form-label fw-semibold">Leader Full Name *</label><input type="text" class="form-control" id="lName" required></div>
              <div class="col-md-6"><label class="form-label fw-semibold">Leader Roll Number *</label><input type="text" class="form-control" id="lRoll" required></div>
              <div class="col-md-6"><label class="form-label fw-semibold">Branch *</label><input type="text" class="form-control" id="lBranch" value="CSE" required></div>
              <div class="col-md-6"><label class="form-label fw-semibold">Academic Year *</label><input type="text" class="form-control" id="lYear" value="3rd Year" required></div>
            </div>
            <div id="teamSection">
              <label class="form-label fw-semibold">Team / Squad Name</label>
              <input type="text" class="form-control mb-3" id="tName" placeholder="e.g. Phoenix Squad">
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-success fw-semibold"><i class="bi bi-send-check me-1"></i>Confirm Registration</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Tickets Modal -->
  <div class="modal fade" id="myTicketsModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-dark text-white"><h5 class="modal-title fw-bold">My Registered Passes</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><div class="list-group" id="ticketsList"></div></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('userDisplay').innerText = `Student: ${user.name} (${user.uniqueId || user.email})`;
    let activeEvent = null;

    async function fetchLiveEvents() {
      const res = await fetch('/api/events/live');
      const events = await res.json();
      const grid = document.getElementById('eventsGrid');
      grid.innerHTML = '';

      events.forEach(ev => {
        grid.innerHTML += `
          <div class="col-md-6 col-lg-4">
            <div class="card event-card shadow-sm h-100">
              <img src="${ev.image || 'https://images.unsplash.com/photo-1501386761578-eac5c94b800a'}" class="event-banner-img card-img-top">
              <div class="card-body d-flex flex-column">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <span class="badge bg-primary-subtle text-primary">${ev.category} Club</span>
                  <span class="badge bg-warning text-dark">${ev.fee === 0 ? 'Free' : '₹' + ev.fee}</span>
                </div>
                <h5 class="card-title fw-bold text-dark">${ev.title}</h5>
                <p class="card-text text-muted small flex-grow-1">${ev.description}</p>
                <div class="border-top pt-3">
                  <div class="small text-secondary mb-1"><i class="bi bi-calendar3 me-2"></i>${ev.date}</div>
                  <div class="small text-secondary mb-3"><i class="bi bi-geo-alt me-2"></i>${ev.venue}</div>
                  <button class="btn btn-primary w-100 fw-semibold" onclick='openModal(${JSON.stringify(ev)})'>Register Now</button>
                </div>
              </div>
            </div>
          </div>
        `;
      });
    }

    function openModal(ev) {
      activeEvent = ev;
      document.getElementById('modalTitle').innerText = ev.title;
      document.getElementById('mFee').innerText = ev.fee === 0 ? 'Free (₹0)' : `₹${ev.fee}`;
      document.getElementById('mCategoryBadge').innerText = `${ev.category} Coordinator Verification`;
      document.getElementById('lName').value = user.name || '';
      document.getElementById('lRoll').value = user.uniqueId || '';
      new bootstrap.Modal(document.getElementById('eventRegModal')).show();
    }

    document.getElementById('teamRegForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        eventId: activeEvent._id,
        eventName: activeEvent.title,
        category: activeEvent.category,
        leaderName: document.getElementById('lName').value,
        leaderRoll: document.getElementById('lRoll').value,
        branch: document.getElementById('lBranch').value,
        year: document.getElementById('lYear').value,
        teamName: document.getElementById('tName').value || 'Solo',
        fee: activeEvent.fee
      };
      const res = await fetch('/api/registrations/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      alert(`🎉 Registered Successfully!\nPass ID: ${data.reg.passId}\nRequest forwarded to ${activeEvent.category} Faculty Mentor.`);
      bootstrap.Modal.getInstance(document.getElementById('eventRegModal')).hide();
    });

    async function loadMyTickets() {
      const res = await fetch(`/api/registrations/student/${user.uniqueId || '21BCS045'}`);
      const list = await res.json();
      const container = document.getElementById('ticketsList');
      container.innerHTML = list.length === 0 ? '<p class="text-muted p-3 text-center">No tickets found.</p>' : '';
      list.forEach(t => {
        container.innerHTML += `
          <div class="list-group-item p-3 mb-2 border rounded">
            <div class="d-flex justify-content-between">
              <h6 class="fw-bold text-primary mb-1">${t.eventName}</h6>
              <span class="badge bg-dark">${t.passId}</span>
            </div>
            <p class="small mb-1"><strong>Team:</strong> ${t.teamName} | ${t.branch} - ${t.year}</p>
            <span class="badge bg-success-subtle text-success">${t.category} Club Verified</span>
          </div>
        `;
      });
    }

    fetchLiveEvents();
  </script>
</body>
</html>
