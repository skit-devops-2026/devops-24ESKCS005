<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><title>Faculty Dashboard - EventHive</title>
  <script>
    const user = JSON.parse(sessionStorage.getItem('userData') || '{}');
    if (!sessionStorage.getItem('isLoggedIn') || user.role !== 'faculty') window.location.replace('../../login.html');
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-primary" href="#">EventHive <span class="text-white-50 fs-6">| Faculty Mentor</span></a>
      <div class="d-flex align-items-center gap-3">
        <span class="text-light small" id="facultyDisplay"></span>
        <button class="btn btn-danger btn-sm" onclick="sessionStorage.clear(); window.location.replace('../../login.html');">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="card p-4 bg-dark text-white rounded-3 mb-4 shadow-sm">
      <h3 class="fw-bold mb-1" id="fTitle">Faculty Portal</h3>
      <p class="text-white-50 mb-0">Assigned Domain: <strong class="text-warning" id="fDomain"></strong></p>
    </div>

    <!-- Section 1: Club Event Proposals -->
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-header bg-white py-3"><h5 class="fw-bold mb-0 text-primary"><i class="bi bi-file-earmark-check me-2"></i>Club Event Proposals (Stage 1 Review)</h5></div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light"><tr><th>Event Title</th><th>Date & Venue</th><th>Budget</th><th>Status</th><th>Mentor Action</th></tr></thead>
          <tbody id="proposalsBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Section 2: Student Registrations -->
    <div class="card shadow-sm border-0">
      <div class="card-header bg-white py-3"><h5 class="fw-bold mb-0 text-dark"><i class="bi bi-people me-2"></i>Student Registrations for this Club</h5></div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light"><tr><th>Applicant</th><th>Roll & Branch</th><th>Event</th><th>Team</th><th>Pass ID</th></tr></thead>
          <tbody id="registrationsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('facultyDisplay').innerText = `Mentor: ${user.name}`;
    document.getElementById('fTitle').innerText = `${user.name} - Coordinator Desk`;
    document.getElementById('fDomain').innerText = `${user.domain} Club Operations`;

    async function loadFacultyData() {
      // 1. Load Proposals
      const resProp = await fetch(`/api/events/faculty/${user.domain}`);
      const proposals = await resProp.json();
      const pBody = document.getElementById('proposalsBody');
      pBody.innerHTML = proposals.length === 0 ? '<tr><td colspan="5" class="text-center text-muted py-3">No event proposals submitted yet.</td></tr>' : '';
      proposals.forEach(p => {
        pBody.innerHTML += `
          <tr>
            <td><strong>${p.title}</strong></td>
            <td>${p.date}<br><small class="text-muted">${p.venue}</small></td>
            <td class="fw-bold">₹${p.budget}</td>
            <td><span class="badge ${p.facultyStatus === 'Approved' ? 'bg-success' : 'bg-warning text-dark'}">${p.facultyStatus}</span></td>
            <td>
              ${p.facultyStatus === 'Pending' ? `
                <button class="btn btn-success btn-sm me-1" onclick="updateEventStatus('${p._id}', 'Approved')">Verify & Send to HOD</button>
                <button class="btn btn-danger btn-sm" onclick="updateEventStatus('${p._id}', 'Rejected')">Reject</button>
              ` : '<small class="text-muted">Reviewed</small>'}
            </td>
          </tr>
        `;
      });

      // 2. Load Student Regs
      const resReg = await fetch(`/api/registrations/faculty/${user.domain}`);
      const regs = await resReg.json();
      const rBody = document.getElementById('registrationsBody');
      rBody.innerHTML = regs.length === 0 ? '<tr><td colspan="5" class="text-center text-muted py-3">No registrations for this club yet.</td></tr>' : '';
      regs.forEach(r => {
        rBody.innerHTML += `
          <tr>
            <td><strong>${r.leaderName}</strong></td>
            <td>${r.leaderRoll}<br><small class="text-muted">${r.branch}</small></td>
            <td><strong class="text-primary">${r.eventName}</strong></td>
            <td>${r.teamName}</td>
            <td><span class="badge bg-dark">${r.passId}</span></td>
          </tr>
        `;
      });
    }

    async function updateEventStatus(id, status) {
      await fetch(`/api/events/${id}/faculty-status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      alert(`Proposal status marked as ${status}!`);
      loadFacultyData();
    }

    loadFacultyData();
  </script>
</body>
</html>
